name: Bug Report
description: Report a bug or unexpected behaviour in Testcontainers.Floci
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible so we can reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: Testcontainers.Floci version
      placeholder: "e.g. 0.1.1"
    validations:
      required: true

  - type: input
    id: floci-image
    attributes:
      label: Floci Docker image
      description: The `floci/floci` image tag in use, if you overrode the default.
      placeholder: "e.g. floci/floci:1.5.22"

  - type: input
    id: tfm
    attributes:
      label: Target framework / .NET version
      placeholder: "e.g. net8.0, net10.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a code snippet that reproduces the issue.
      placeholder: |
        1. Build a FlociContainer with new FlociBuilder(...)...
        2. Call ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include any error messages, stack traces, or log output.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any other relevant details about your environment.
      placeholder: |
        OS: macOS 15, Windows 11, Ubuntu 24.04
        Docker / Colima: e.g. Docker 27.x, Colima 0.7
