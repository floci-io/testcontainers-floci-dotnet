version: 2
updates:
  # The packages' own dependencies: a bump reaches every consumer, so it is a fix and goes in the
  # changelog. Titles must be Conventional Commits (the PR title is checked and becomes the commit).
  - package-ecosystem: nuget
    directories:
      - "/src/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "fix(deps)"
    # One PR per dependency across src/*: without this, a bump shared by Floci.Testcontainers.Core and
    # Floci.Testcontainers.Aws opened two PRs (one per project) that conflict with each other.
    groups:
      src:
        group-by: dependency-name

  # Test-only dependencies: chores, no release.
  - package-ecosystem: nuget
    directories:
      - "/tests/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The test projects pull ~30 AWSSDK.* packages — group them into one PR to avoid noise.
      aws-sdk:
        patterns:
          - "AWSSDK.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
