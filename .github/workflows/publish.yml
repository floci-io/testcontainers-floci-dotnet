name: publish

# Auto-SemVer from Conventional Commits (ietf-tools/semver-action), then publish to the FinLegal
# GitHub Packages feed on every push to main.
#
# Commit messages drive the bump: `feat:` -> minor, `fix:`/`perf:`/`refactor:`/`test:` -> patch,
# a `!` or `BREAKING CHANGE` -> major. Anything else still advances a patch (noVersionBumpBehavior:
# patch), so every push to main produces a release. Use Conventional Commits for meaningful bumps.
on:
  push:
    branches: [ main ]
    # Docs/metadata-only pushes don't change the package, so they don't cut a release.
    # (A push that also touches code/tests still triggers — paths-ignore only skips when
    # every changed file matches.)
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write   # create the version tag + release
  packages: write   # push the package to GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Fast gate only. The unit project is the no-Docker tier (the *ConfigTest classes cover the
      # env-var mapping for every service). The container-backed integration project runs on PRs
      # via ci.yml, not in this publish path.
      - name: Unit tests
        run: dotnet test tests/Testcontainers.Floci.Tests/Testcontainers.Floci.Tests.csproj -c Release

      - name: Compute version (Conventional Commits)
        id: version
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          # Don't fail when a push has no feat/fix-style commit — still ship a patch.
          noVersionBumpBehavior: patch
          # When HEAD is already the latest tag (e.g. the seeded v0.1.0 baseline), emit that
          # version rather than erroring, so the first run publishes the baseline cleanly.
          noNewCommitBehavior: current

      - name: Pack
        run: >
          dotnet pack src/Testcontainers.Floci/Testcontainers.Floci.csproj
          -c Release
          -p:PackageVersion=${{ steps.version.outputs.nextStrict }}
          -o artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/FinLegal/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Tag + release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.nextStrict }}
          name: v${{ steps.version.outputs.nextStrict }}
          generate_release_notes: true
