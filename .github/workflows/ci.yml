name: ci

# Runs on every PR: a no-Docker unit job and a container-backed integration job, in parallel.
on:
  pull_request:
    branches: [ main ]
    # Skip the build/test suite for changes that can't affect it: docs and repo furniture.
    # Ignore all of .github/ EXCEPT workflows, so changes to the workflows still run CI.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '!.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build (warnings as errors)
        run: dotnet build Testcontainers.Floci.slnx -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/Testcontainers.Floci.Tests/Testcontainers.Floci.Tests.csproj -c Release --no-build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Cache the Floci gateway image plus the sibling images Floci spawns, so test runs don't hit
      # Docker Hub's anonymous pull rate limit. On a cache hit we docker-load the tarballs (zero
      # Docker Hub requests); on a miss we pull once and save. See .github/docker-images.txt.
      # Restore/save are split (rather than actions/cache) so the cache is written immediately
      # after pulling — before the tests run — and therefore persists even if a test later fails.
      - name: Restore Docker image cache
        id: docker-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/docker-images
          key: docker-images-v1-${{ hashFiles('.github/docker-images.txt') }}

      - name: Load or pull Docker images
        run: |
          set -euo pipefail
          mkdir -p ~/docker-images
          if [ -n "$(ls -A ~/docker-images 2>/dev/null)" ]; then
            for f in ~/docker-images/*.tar; do docker load -i "$f"; done
          else
            grep -vE '^\s*(#|$)' .github/docker-images.txt | while read -r img; do
              docker pull "$img"
              docker save "$img" -o ~/docker-images/"$(echo "$img" | tr '/:' '__')".tar
            done
          fi

      - name: Save Docker image cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/docker-images
          key: docker-images-v1-${{ hashFiles('.github/docker-images.txt') }}

      - name: Integration tests
        run: dotnet test tests/Testcontainers.Floci.IntegrationTests/Testcontainers.Floci.IntegrationTests.csproj -c Release
