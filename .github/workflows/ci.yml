name: ci

# Pull-request gate. Runs the two test tiers as separate jobs:
#   - unit:        the no-Docker *ConfigTest project (env-var mapping for every service).
#   - integration: the container-backed *ServiceTest project (starts Floci, real AWS SDK
#                  round-trips; some tests spawn sibling containers).
# The two jobs run in parallel for the fastest feedback.
# Native Linux Docker on the runner needs none of the Colima/macOS overrides — Ryuk works
# out of the box.
on:
  pull_request:
    branches: [ main ]
    # Docs/metadata-only PRs don't change behaviour, so skip the (heavy) suite.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

# Cancel superseded runs on the same PR so the expensive integration job doesn't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Build the whole solution as the 0-warnings gate: src (all five TFMs) plus both test
      # projects. A warning anywhere fails the PR.
      - name: Build (warnings as errors)
        run: dotnet build Testcontainers.Floci.slnx -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/Testcontainers.Floci.Tests/Testcontainers.Floci.Tests.csproj -c Release --no-build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Front-load the Floci image pull so a registry hiccup is a clear, fast failure rather
      # than a test timeout. Keep this tag in sync with TestImages.Floci.
      - name: Pull Floci image
        run: docker pull floci/floci:1.5.22

      - name: Integration tests
        run: dotnet test tests/Testcontainers.Floci.IntegrationTests/Testcontainers.Floci.IntegrationTests.csproj -c Release
