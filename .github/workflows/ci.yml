name: ci

# Runs on every PR: a no-Docker unit job and a container-backed integration job, in parallel.
on:
  pull_request:
    branches: [ main ]
    # Skip the build/test suite for changes that can't affect it: docs and repo furniture.
    # Ignore all of .github/ EXCEPT workflows, so changes to the workflows still run CI.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '!.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (warnings as errors)
        run: dotnet build Testcontainers.Floci.slnx -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/Testcontainers.Floci.Tests/Testcontainers.Floci.Tests.csproj -c Release --no-build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Keep this tag in sync with TestImages.Floci.
      - name: Pull Floci image
        run: docker pull floci/floci:1.5.22

      - name: Integration tests
        run: dotnet test tests/Testcontainers.Floci.IntegrationTests/Testcontainers.Floci.IntegrationTests.csproj -c Release
