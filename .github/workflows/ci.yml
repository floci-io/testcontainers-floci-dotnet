name: ci

# Runs on every PR: a no-Docker unit job and a container-backed integration job, in parallel.
# The workflow always runs, because `integration` is a required check: skipping the whole workflow
# (paths-ignore) left docs-only PRs blocked forever. The `changes` job skips the test jobs instead,
# and a job skipped by its `if:` counts as passing for required checks.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the build and tests are needed: not for docs and repo furniture (Markdown, LICENSE,
  # .gitignore, and .github/ except its workflows and the pinned test images, which still run them).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the changed files
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A failed comparison stops this job (and the test jobs then run anyway, see below);
          # --no-renames lists both sides of a rename, so moving code to a .md path still counts.
          changed=$(git diff --no-renames --name-only "$BASE...$HEAD")
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .github/workflows/* | .github/docker-images.txt) code=true ;;
              *.md | LICENSE | .gitignore | .github/*) ;;
              *) code=true ;;
            esac
            echo "$f"
          done <<< "$changed"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  unit:
    needs: changes
    # Run when the filter says so, and also whenever the filter itself did not succeed: an unknown
    # change set is tested, so the required check never passes without running the tests.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (warnings as errors)
        run: dotnet build Floci.Testcontainers.slnx -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/Floci.Testcontainers.Aws.Tests/Floci.Testcontainers.Aws.Tests.csproj -c Release --no-build

  integration:
    needs: changes
    # Run when the filter says so, and also whenever the filter itself did not succeed: an unknown
    # change set is tested, so the required check never passes without running the tests.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Cache the Floci gateway image plus the sibling images Floci spawns, so test runs don't hit
      # Docker Hub's anonymous pull rate limit. On a cache hit we docker-load the tarballs (zero
      # Docker Hub requests); on a miss we pull once and save. See .github/docker-images.txt.
      # Restore/save are split (rather than actions/cache) so the cache is written immediately
      # after pulling — before the tests run — and therefore persists even if a test later fails.
      - name: Restore Docker image cache
        id: docker-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/docker-images
          key: docker-images-v1-${{ hashFiles('.github/docker-images.txt') }}

      - name: Load or pull Docker images
        run: |
          set -euo pipefail
          mkdir -p ~/docker-images
          if [ -n "$(ls -A ~/docker-images 2>/dev/null)" ]; then
            for f in ~/docker-images/*.tar; do docker load -i "$f"; done
          else
            grep -vE '^\s*(#|$)' .github/docker-images.txt | while read -r img; do
              docker pull "$img"
              docker save "$img" -o ~/docker-images/"$(echo "$img" | tr '/:' '__')".tar
            done
          fi

      - name: Save Docker image cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/docker-images
          key: docker-images-v1-${{ hashFiles('.github/docker-images.txt') }}

      - name: Integration tests
        run: dotnet test tests/Floci.Testcontainers.Aws.IntegrationTests/Floci.Testcontainers.Aws.IntegrationTests.csproj -c Release
